# 算子 13 评分音文语义一致性（表1 #13）默认配置。
# v2 生产口径：复用上游 Whisper-base 转写，规则型 CER 门禁；不在本算子加载独立基座模型。

operator:
  name: audio_text_scoring
  version: v2.0.0

# S3 数据加工阶段
stage_id: S3

# 表1 总开关：默认关闭。关闭时不加载模型、不写音文评分文件、不隔离。
# 跨算子约束：音文评分与图文评分同时关闭时由任务创建侧拦截，本算子只管自己这一项。
enabled: false

# 表1 参数 2：转写文本与对齐描述的编辑距离比例上限（可配 0.10–0.50）
edit_distance_ratio_max: 0.30

# 文本归一化：比较前先把繁体字逐字符转简体（ASR 偶发繁体输出时避免误判）。
# 默认开启；映射表随算子包离线自带（utils/data/TSCharacters.txt），运行时绝不联网。
traditional_to_simplified: true

# 中文 ITN：比较前把中文数字/百分比/数量单位表达归一为阿拉伯数字（utils/itn.py，
# 纯规则、离线）。消除「三点八亿 vs 38亿」「百分之六点八 vs 6.8%」等写法差异造成
# 的 CER 虚高；不改变 edit_distance_ratio_max 的阈值语义。默认开启，可显式关闭对照。
inverse_text_normalization: true

# 语言适用性门：中文 CER 阈值只对中文描述有语义。描述侧一个中文字符都没有时
# （英文素材、时序窗口的英文字幕等），Whisper 受 #8「固定中文解码」约束输出
# 中文/混排转写，与英文描述算 CER 必然虚高；此类音文对判 not_applicable
# （不隔离、留产线，交下游/时序路线继续判定），不写入「语义不通」隔离台账。
# 默认开启；置 false 可回退为纯 CER 口径做对照。
language_gate: true

# 转写可靠性门：Whisper-base 在音乐/噪声/低信噪比片段上会产生解码重复循环
# （实测 4.88s 音频解码出 453 字，即 93 字/秒），或整体语速超出物理上限。
# 这类转写下的 CER 度量的是 ASR 故障程度，不是音文语义差异，不能据此判
# 「语义不通」；判 not_applicable（不隔离、留产线，交 #15 等下游证据继续判定）。
# 默认开启；置 false 可回退为纯 CER 口径做对照。
transcript_reliability_gate: true

# 同音容错：编辑距离里「替换成同音字」的代价记为 0，阈值 edit_distance_ratio_max
# 与分母口径都不变（判定取严格口径与同音容错口径的较小值，只会更宽松）。
# Whisper-base 的中文错误多为同音误写（张工程师→張宮城師、午休时→胡修實、
# 锻炼身体→斷鏈身體），字符 CER 0.56–0.57 会被判「语义不通」，但口语内容一致；
# 归零同音替换后落到阈值内，真实语义差异（不同的人/地/事）不同音，仍超限。
# 字→音节表随包离线交付（utils/data/PinyinTable.txt），表缺失时本项自动按关闭处理。
# 默认开启；置 false 可回退纯字符 CER 口径做对照。
homophone_tolerance: true

# 中文口语语速物理上限（字符/秒），超过即判转写不可靠。正常中文口播约 3–7 字/秒，
# 这里取 30 字/秒，只用于识别 ASR 故障（不是快慢语速判定）。可配范围 15.0–60.0。
max_chars_per_second: 30.0

# 前端只提供 16000Hz（表1）；这里仅用于音频可读性检查，不送入独立语义模型。
sample_rate: 16000

# 资源保护：超长音频按段落语义单元截断后做可读性检查。
max_audio_seconds: 30.0
max_text_chars: 500
