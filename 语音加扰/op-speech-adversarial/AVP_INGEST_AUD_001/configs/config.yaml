# 01 语料入库匹配校验（avp_ingest_corpus）
# 所有阈值/系数必须来自本文件，代码里不得出现魔法数字。

operator:
  id: avp_ingest_corpus
  name: 语料入库匹配校验
  tag: 语料入库
  version: v1.0.0
  number: 1

io:
  audio_exts: [".wav", ".mp3", ".flac", ".aiff", ".aif", ".ogg", ".opus"]
  manifest_exts: [".txt", ".tsv", ".csv", ".jsonl", ".json"]
  # 报告里最多列出的问题文件名条数（防止报告膨胀；统计数仍是全量）
  max_listed: 200
  output_subdir: ""

audio:
  sample_rate: 16000
  max_abs: 0.99
  # 「空音频」判定阈值（RMS），与任务书「空音频」检查口径一致
  silence_rms: 0.00001

checks:
  # 内置三项入库检测（只提示不阻断）
  min_duration_sec: 2.0      # 时长小于该值 → 短音频
  empty_audio: true          # 是否做空音频检测
  duplicate_text: true       # 是否做文本完全重复检测
  # 文本归一化后再比较（压缩连续空白、去首尾）
  normalize_text: true

dataset:
  name_min_len: 2
  name_max_len: 50
  # 不传 dataset_id 时的生成规则
  id_prefix: "DS"
  default_timezone: "Asia/Shanghai"
