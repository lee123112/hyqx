version: "3.9"

services:
  avp:
    build: .
    image: audio-adversarial-pipeline:v1.0.0
    container_name: op-speech-adversarial
    ports:
      - "17023:8000"
    volumes:
      - ./data:/data
    environment:
      LOG_LEVEL: INFO
      AVP_DATA_ROOT: /data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped
