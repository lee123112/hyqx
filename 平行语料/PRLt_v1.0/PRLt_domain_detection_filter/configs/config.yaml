# 算子16：领域识别与筛选配置
operator:
  name: domain_recognition
  version: v1.3.0

# 上游算子3/4 已完成编码归一；本节点默认只接受严格 UTF-8。
input_encodings: [utf-8]

# 上游默认产物名（阶段内实际路径由 /predict 的 inputFile 指定）。
input_file_name: 15_fluency_checked.jsonl

# 只读参与领域判定的字段，不改写 source/target 原文。
text_fields: [source, target]

# 任务声明的语言方向；记录 language_pair（或 source_lang/target_lang）必须与之一致。
source_lang: zh
target_lang: en
language_check: true

# ---- 后端门禁 ----
# auto=有模型用模型、无模型按 fallback_policy；model=必须用模型；rule_degraded=只做规则降级。
# 正式版：本地 Qwen3-Embedding-0.6B（models/Qwen3-Embedding-0.6B，1024 维）零样本原型分类。
# 适配器对 7 个标签（5 个业务领域 + out_of_scope/unknown）的种子描述做平均嵌入得到原型，
# 用句对嵌入与原型余弦 + 温度 softmax 输出真实概率；不使用 BGE-M3 的逻辑回归系数，
# 旧 models/bge-domain-prototype 保持不动但不再被本配置引用。
# 模型不可用时按 fallback_policy=fail 结构化失败，不静默降级。
backend: model
model_service_url: null
model_name: Qwen3-Embedding-0.6B
model_path: ../models/Qwen3-Embedding-0.6B/domain_adapter.py
model_version: Qwen3-Embedding-0.6B-zero-shot-prototype-v1.0
model_timeout_seconds: 30
# 本地模型适配器入口函数名（adapter.py 中的可调用对象）。
model_entrypoint: classify_domain
# 关键词相关性打分入口（legacy_domain 模式不使用）。
relevance_entrypoint: score_relevance
# 模型不可用时：rule_degraded=降级并标记 degraded；fail=结构化失败（不静默降级）。
fallback_policy: fail
# 单次任务允许的模型错误条数，超过则整次失败，不静默截断。
max_model_errors: 20

# ---- 关键词相关性（2026-11-03，需求 30 号「领域相关性校验」）----
# 业务流程：按任务给的关键词算句对相关性分 → 与阈值比较 → 低于阈值进抽检台。
# 分值是 logistic_cos_diff（关键词余弦 − 通用文本负样本余弦，过 logistic），
# **不是概率**，也没有人工相关性 Gold；60% 是业务阈值，不能当作准确率。
relevance_mode: keyword_relevance      # keyword_relevance | legacy_domain（回滚到固定领域分类）
# 输入框（--1021）原样传入的字符串，必须用「；」分隔；工程侧同时容忍 ; 与换行。
# 下面这份默认词表覆盖原五个业务领域（中英各一份），与旧 allowed_domains 口径对齐；
# 实际任务由 /predict 的 params.relevance_keywords 覆盖。
# [2026-11-04 词表补齐] 原词表只覆盖了每个领域最粗的几个词（技术/医疗尤其薄），
# 真实语料里的「医生、护理、疫苗、云计算、平台、芯片」等命中不到，造成领域内文本被误判低相关。
# 本次按「技术、医疗」为主，兼顾法律/金融/教育的常见书面词补齐；仍是模板默认值，
# 实际任务由 params.relevance_keywords 覆盖（业务词表以任务输入为准）。
relevance_keywords: "医疗；医学；患者；诊断；临床；心脏；疾病；治疗；药物；手术；医院；医生；护理；疫苗；癌症；肿瘤；症状；病例；卫生；器械；法庭；法律；法规；合同；诉讼；法院；律师；判决；条款；公约；决议；条例；立法；司法；金融；银行；利率；投资；股票；贷款；经济；预算；账户；货币；汇率；税收；审计；技术；算法；软件；数据库；人工智能；网络；系统；平台；数据；计算；云计算；模型；芯片；编程；自动化；信息；机器人；教育；课程；学生；教学；考试；学校；培训；大学；学位；medical；patient；clinical；diagnosis；treatment；hospital；doctor；nurse；nursing；vaccine；cancer；symptom；device；legal；contract；lawsuit；court；lawyer；regulation；legislation；tribunal；finance；bank；investment；stock；budget；currency；tax；audit；technology；algorithm；software；database；network；system；platform；data；computing；cloud；model；chip；programming；automation；information；robot；education；course；student；exam；training；university；degree"
# 领域相关性阈值 ≥：score >= threshold 判为相关（含等号）。默认 60%。
relevance_threshold: 0.60
# 打分温度：把余弦差放大成 0–1 分值；0.05 由 844 条真实语料分档标定后确定。
relevance_temperature: 0.05
# 聚合口径：max=取最高余弦；top3_mean=前 3 均值（短句/数字句可用）。
relevance_aggregate: max

# ---- 父句/段落聚合（2026-11-04）----
# 问题：10 号把父句切成子句后，单条子句常常只有几个字（「增编」「虽然当地行为体参与项目的实施，」），
# 与关键词的余弦天然偏低。全链路实测 805 条子句里 389 条被判低相关，人工抽检大量是父句整体
# 相关的误杀（42% 量级）。口径改为：同一父级分组按拼接后的父级文本打一次分，再把父级分下发给
# 组内记录，子句不再单独决定去留；分组键按 relevance_parent_key_fields 顺序查找。
relevance_parent_aggregation: true
# 分组键：parent_pair_id（10 号子句对的父句 ID）→ paragraph_id（段落级语料）。
relevance_parent_key_fields: [parent_pair_id, paragraph_id]
# 组内记录数达到该值才聚合；1 = 不聚合（逐条打分）。
relevance_parent_min_units: 2
# parent=子记录继承父级分（默认，上下文最完整）；max=父级分与自身分取大。
relevance_parent_policy: parent
# 父级聚合文本字符上限（0=不截断）；嵌入模型有长度上限，1200 足够容纳一个段落。
relevance_parent_max_chars: 1200

# ---- 超短碎片守卫（2026-11-05）----
# 源与目标两侧都去空白后字符数 <= fragment_min_chars 时不进入相关性判定：
# 直接 relevance_status=low_relevance、review_status=waiting_manual、
# trigger_reason=fragment_too_short，relevance_score 保持 null（不伪造分数）。
# 依据：Fullflow-Effect-Bench-v1 的 20 条 fragment 标签（「银行 / bank」）此前在 10 号被
# 碎片门禁删掉，本算子根本看不到；而这类 1-4 字片段交给嵌入模型只会放大余弦噪声
# （历史 rel-027「心」/ heart 得 0.985）。记录仍写入主输出，由 17 号按标记拦截。
# 只要求「任一侧短」会误伤短术语对与单侧碎屑：自然语料 844 条子句对命中 39 条（4.6%）；
# 两侧都短的口径在自然语料上 0 命中，构造缺陷 20/20 命中。
fragment_guard: true
fragment_min_chars: 4

# ---- 文档主题一致性（2026-11-05）----
# 问题：一篇文档里大部分单位已经判低相关（跑题内容），剩下少数「恰好命中关键词」的单位
# 仍然拿到高分——父句级打分看不见文档环境，模型只看得见关键词本身
# （Fullflow-Effect-Bench-v1 defect-11-013：跑题的歌手段落 0.28、孤立碎片「银行」0.99、
#  剩下三条合同段落 0.96，而整篇文档 0.38）。
# 口径：文档内低相关单位占比 >= document_consistency_min_low_ratio 且单位数 >=
# document_consistency_min_units 时，把该文档其余「通过」单位改判 manual_review
# （待复核，不物理删除，不伪造分数），trigger_reason=document_topic_inconsistent。
# 文档键取记录 id 的 "::" 前缀（<document>::<para>-...），与父级分组同一套既有约定。
# 实测：109 篇自然文档（flores 50 + holdout 59，共 1058 条）0 篇命中。
document_consistency_guard: true
document_consistency_min_units: 5
document_consistency_min_low_ratio: 0.3

# 低于阈值：manual_review=保留在主输出并进抽检台（默认）；reject=物理拒收；keep=标记后放行。
low_relevance_action: manual_review
# 关键词为空：manual_review=全部进抽检台（默认，绝不静默放行）；pass_all=不做相关性过滤。
empty_keyword_policy: manual_review
# 输入框硬上限：超数量/超长度直接报配置错误，不静默截断。
max_relevance_keywords: 200
max_keyword_length: 64

# ---- 领域集合与筛选（legacy_domain 模式专用，keyword_relevance 下不生效）----
# 目标业务范围；不在该集合的样本进入 out_of_scope，不得进入 accepted。
allowed_domains: [medical, legal, finance, technology, education]
# 为 true 时不做范围外判定（整库交付）；未知领域仍进入 waiting_manual。
allow_all_domains: false
# legacy 模式的阈值（v1.1.0 口径，0.80）；keyword_relevance 模式改用 relevance_threshold。
domain_confidence_threshold: 0.80
# 允许多标签时记录 candidates 数组，并以主标签和主置信度参与筛选。
allow_multi_label: false
max_candidates: 5

# ---- 规则降级词表（只用于真实命中证据，绝不生成置信度）----
domain_keywords:
  medical:
    [医疗, 医学, 患者, 诊断, 临床, 心脏, 心血管, 药物, 手术,
     patient, clinical, cardiac, diagnosis, medical]
  legal:
    [法律, 法规, 合同, 诉讼, 法院, 律师, court, contract, lawsuit, lawyer]
  finance:
    [金融, 银行, 利率, 投资, 股票, 贷款, bank, investment, stock, loan]
  technology:
    [技术, 算法, 软件, 硬件, 人工智能, 数据库,
     algorithm, software, hardware, database, technology]
  education:
    [教育, 课程, 学生, 教学, 考试, course, student, teaching, exam]
  # 通用内容显式识别为 general；默认不在 allowed_domains，因而进入 out_of_scope，
  # 不再强行归入五个业务领域或以低置信等待人工确认。
  general: [通用, 日常, 社会, 文化, 人物, 演讲, general, everyday, society, culture, talk]
  # 以下领域默认不在 allowed_domains 内，用于演示范围外筛选。
  sports: [足球, 篮球, 比赛, 运动员, football, basketball, athlete]
  entertainment: [电影, 音乐, 明星, 综艺, movie, music, celebrity]

# 规则后端子领域词表（可选）。
subdomain_keywords:
  medical:
    cardiology: [心脏, 心血管, cardiac, cardiology]
    oncology: [肿瘤, 癌症, cancer, oncology]
  legal:
    contract_law: [合同, contract]
    litigation: [诉讼, 法院, lawsuit, litigation]

# 领域别名：模型或上游给出的别名统一映射到规范领域名。
domain_aliases:
  medicine: medical
  healthcare: medical
  health: medical
  law: legal
  legal_affairs: legal
  economics: finance
  it: technology
  tech: technology
  teaching: education
  generic: general
  general_domain: general

# ---- 记录去向 ----
# mark_and_keep=写入主输出并在异常清单留审计；move_to_rejects=只写异常清单。
low_confidence_policy: mark_and_keep
degraded_policy: mark_and_keep
